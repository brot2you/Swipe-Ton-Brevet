}, {"id": "fr161", "t": "fiche", "s": "fr", "h": "Les modes : indicatif, subjonctif, conditionnel, impératif", "b": "- **Indicatif** : le réel, le certain.\n- **Subjonctif** : souhait, doute, obligation, sentiment. Après « il faut que », « bien que », « pour que ».\n- **Conditionnel** : hypothèse, politesse, information non vérifiée, futur dans le passé.\n- **Impératif** : ordre, conseil, sans sujet exprimé.\n- Modes impersonnels : infinitif, participe, **gérondif** (en + participe présent).", "tags": ["conjugaison", "modes"], "em": "🎛️"}, {"id": "fr162", "t": "piege", "s": "fr", "h": "-rai ou -rais ? Futur ou conditionnel", "b": "Remplace par « nous » :\n- « nous partir**ons** » → futur → je partir**ai**\n- « nous partir**ions** » → conditionnel → je partir**ais**\n> Après « si » + imparfait, c’est toujours le conditionnel : « Si j’avais le temps, je partirais. »", "tags": ["orthographe", "conjugaison"], "em": "🔮"}, {"id": "fr163", "t": "fiche", "s": "fr", "h": "Juxtaposer, coordonner, subordonner", "b": "- **Juxtaposition** : propositions reliées par une ponctuation (virgule, point-virgule, deux-points).\n- **Coordination** : par une conjonction de coordination (mais, ou, et, donc, or, ni, car) ou un adverbe de liaison.\n- **Subordination** : une proposition dépend d’une autre, introduite par un subordonnant (que, quand, parce que, qui…).\n> Pour compter les propositions : compte les verbes conjugués.", "tags": ["grammaire", "propositions"], "em": "🔗"}, {"id": "fr164", "t": "fiche", "s": "fr", "h": "Comment un mot est fabriqué", "b": "> im + prévis + ible\n- **Préfixe** avant le radical : il change le sens (im- = contraire, re- = répétition, pré- = avant).\n- **Radical** : le cœur du mot, porteur du sens.\n- **Suffixe** après : il change souvent la classe (-able → adjectif, -ment → adverbe, -tion → nom).\n- **Famille de mots** : tous les mots construits sur le même radical.", "tags": ["lexique"], "em": "🧱"}, {"id": "fr165", "t": "fiche", "s": "fr", "h": "Champ lexical, polysémie, connotation", "b": "- **Champ lexical** : ensemble des mots qui renvoient à un même thème. Il révèle le sujet ou l’atmosphère d’un texte.\n- **Polysémie** : un mot a plusieurs sens selon le contexte (« une **pièce** de théâtre, de monnaie, d’un appartement »).\n- **Dénotation** : le sens neutre du dictionnaire. **Connotation** : ce que le mot suggère en plus (le rouge : sang, passion, danger).", "tags": ["lexique", "analyse"], "em": "🗂️"}, {"id": "fr166", "t": "fiche", "s": "fr", "h": "Les 5 thèmes du programme de 3e", "b": "- **Se raconter, se représenter** : autobiographie, mémoires, journal, autoportrait.\n- **Dénoncer les travers de la société** : satire, ironie, caricature.\n- **Visions poétiques du monde** : la poésie qui transforme le regard.\n- **Agir dans la cité : individu et pouvoir** : textes sur la guerre, l’engagement, la résistance.\n- **Progrès et rêves scientifiques** : science-fiction, anticipation.\n> Le texte du brevet appartient presque toujours à l’un d’eux.", "tags": ["programme"], "em": "📚"}, {"id": "fr167", "t": "fiche", "s": "fr", "h": "L’autobiographie et le pacte", "b": "Dans une autobiographie, **auteur = narrateur = personnage principal**, et le récit porte sur sa propre vie.\n- **Pacte autobiographique** : l’auteur s’engage à dire la vérité sur lui-même (Philippe Lejeune).\n- Formes voisines : **mémoires** (témoignage sur une époque), **journal intime** (écrit au jour le jour), **autoportrait**.\n- Deux « je » : celui qui écrit (adulte) et celui qui a vécu (souvent enfant). Repère les temps : présent d’écriture, passé du souvenir.", "tags": ["se raconter"], "em": "🪞"}, {"id": "fr168", "t": "fiche", "s": "fr", "h": "Versification : compter, rimer, reconnaître", "b": "- **Alexandrin** : 12 syllabes ; **décasyllabe** : 10 ; **octosyllabe** : 8.\n- Le **e muet** se prononce devant une consonne, pas devant une voyelle ni en fin de vers.\n- Rimes **plates** AABB, **croisées** ABAB, **embrassées** ABBA.\n- **Sonnet** : 2 quatrains + 2 tercets, 14 vers.\n- Strophe de 4 vers : quatrain ; de 3 : tercet.", "tags": ["poésie"], "em": "🎶"}, {"id": "fr169", "t": "fiche", "s": "fr", "h": "Argumenter : convaincre ou persuader ?", "b": "- **Thèse** : l’opinion défendue. **Argument** : la raison. **Exemple** : le cas concret qui illustre.\n- **Convaincre** : faire appel à la raison (arguments logiques, faits).\n- **Persuader** : faire appel aux émotions (images fortes, registre pathétique, interpellation).\n> Un texte efficace mêle souvent les deux.", "tags": ["argumentation"], "em": "🗣️"}, {"id": "fr170", "t": "fiche", "s": "fr", "h": "Dénoncer : ironie, satire, apologue", "b": "- **Ironie** : dire le contraire de ce que l’on pense pour critiquer. Indice : un éloge qui sonne faux.\n- **Satire** : critique moqueuse d’un groupe, d’une institution, des mœurs.\n- **Apologue** : récit court qui porte une leçon (fable, conte philosophique).\n- **Caricature** : exagération des traits pour faire rire et dénoncer.", "tags": ["dénoncer"], "em": "😏"}, {"id": "fr171", "t": "fiche", "s": "fr", "h": "Les connecteurs logiques à maîtriser", "b": "- **Cause** : car, parce que, puisque, en effet.\n- **Conséquence** : donc, c’est pourquoi, si bien que, ainsi.\n- **Opposition, concession** : mais, pourtant, cependant, bien que (+ subjonctif).\n- **Addition** : de plus, en outre, par ailleurs.\n- **But** : pour que, afin que (+ subjonctif), afin de.", "tags": ["argumentation", "rédaction"], "em": "✒️"}, {"id": "fr172", "t": "methode", "s": "fr", "h": "Répondre à une question de compréhension", "b": "1. Reprends les mots de la question dans une **phrase complète**.\n2. Donne ta réponse clairement.\n3. **Cite** le texte entre guillemets, avec le numéro de ligne.\n4. **Explique** la citation : ce qu’elle montre, l’effet produit.\n> Une citation seule ne rapporte presque rien. C’est l’explication qui compte.", "tags": ["compréhension", "méthode"], "em": "🔍"}, {"id": "fr173", "t": "methode", "s": "fr", "h": "Analyser une image au brevet", "b": "1. **Identifier** : nature (photo, tableau, affiche), auteur, date.\n2. **Décrire** : premier plan, arrière-plan, personnages, couleurs, lumière, cadrage.\n3. **Interpréter** : quel effet, quel message, quel lien avec le texte ?\n> Le lien entre le texte et l’image est presque toujours demandé.", "tags": ["image", "méthode"], "em": "🖼️"}, {"id": "fr174", "t": "piege", "s": "fr", "h": "4 homophones de plus qui piègent", "b": "- **ce / se** : se devant un verbe (se lever) ; ce devant un nom ou « ce qui, ce que ».\n- **sa / ça** : ça = cela.\n- **peu / peut** : peut = pouvait.\n- **quel / qu’elle** : qu’elle = qu’il au masculin.", "tags": ["orthographe", "homophones"], "em": "👯"}, {"id": "fr175", "t": "conseil", "s": "fr", "h": "Prépare 3 œuvres « joker » pour la rédaction", "b": "Choisis 3 livres ou films étudiés que tu connais bien (par exemple un témoignage de guerre, un roman d’anticipation, un recueil de poèmes). Note pour chacun l’auteur, le titre, l’idée forte. Ils te serviront d’exemples dans n’importe quel sujet de réflexion.", "tags": ["rédaction"], "em": "✒️"}, {"id": "fr176", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["fonctions"], "q": "« Il semble fatigué » : « fatigué » est…", "o": ["COD", "attribut du sujet", "épithète", "complément circonstanciel"], "a": 1, "e": "« Sembler » est un verbe d’état : « fatigué » est attribut du sujet « il ».", "em": "🧩"}, {"id": "fr177", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["fonctions"], "q": "« Je parle à mon frère » : « à mon frère » est…", "o": ["COD", "COI", "complément du nom", "sujet"], "a": 1, "e": "Complément du verbe introduit par la préposition « à » : COI.", "em": "🧩"}, {"id": "fr178", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["réécriture"], "q": "Mets à la voix passive : « Le vent emporte les feuilles ».", "o": ["Les feuilles ont emporté le vent.", "Les feuilles sont emportées par le vent.", "Les feuilles étaient emportées par le vent.", "Le vent a emporté les feuilles."], "a": 1, "e": "Présent actif → auxiliaire être au présent, participe accordé avec « les feuilles ».", "em": "🔄"}, {"id": "fr179", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["modes"], "q": "« Il faut que tu ___ (venir). »", "o": ["viens", "viendras", "viennes", "viendrais"], "a": 2, "e": "« Il faut que » impose le subjonctif : que tu viennes.", "em": "🎛️"}, {"id": "fr180", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["modes"], "q": "« Si j’avais le temps, je ___ (partir). »", "o": ["partirai", "partirais", "pars", "partis"], "a": 1, "e": "Si + imparfait → conditionnel présent : partirais.", "em": "🎛️"}, {"id": "fr181", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["lexique"], "q": "Dans « imprévisible », le préfixe est…", "o": ["im-", "prévis", "-ible", "-isible"], "a": 0, "e": "« im- » placé avant le radical exprime le contraire.", "em": "🧱"}, {"id": "fr182", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["poésie"], "q": "Un alexandrin compte…", "o": ["8 syllabes", "10 syllabes", "12 syllabes", "14 syllabes"], "a": 2, "e": "Douze syllabes, le vers classique de la poésie française.", "em": "🎶"}, {"id": "fr183", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["poésie"], "q": "Des rimes ABAB sont…", "o": ["plates", "croisées", "embrassées", "suivies"], "a": 1, "e": "A et B alternent : rimes croisées. ABBA : embrassées. AABB : plates.", "em": "🎶"}, {"id": "fr184", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["poésie"], "q": "Un sonnet se compose de…", "o": ["3 quatrains et 1 distique", "2 quatrains et 2 tercets", "4 tercets", "14 strophes"], "a": 1, "e": "14 vers : deux strophes de 4 vers puis deux de 3.", "em": "🎶"}, {"id": "fr185", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["connecteurs"], "q": "« Bien qu’il pleuve, nous sortons. » La subordonnée exprime…", "o": ["la cause", "la conséquence", "la concession", "le but"], "a": 2, "e": "« Bien que » + subjonctif : un obstacle qui n’empêche pas l’action. C’est la concession.", "em": "🔗"}, {"id": "fr186", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["se raconter"], "q": "Dans une autobiographie…", "o": ["l’auteur invente un héros", "auteur, narrateur et personnage principal sont la même personne", "le narrateur est toujours externe", "on écrit toujours au futur"], "a": 1, "e": "C’est la définition du pacte autobiographique.", "em": "🪞"}, {"id": "fr187", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["dénoncer"], "q": "L’ironie consiste à…", "o": ["exagérer", "dire le contraire de ce que l’on pense pour critiquer", "répéter un mot", "comparer deux choses"], "a": 1, "e": "L’ironie fait entendre une critique sous un faux éloge.", "em": "😏"}, {"id": "fr188", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["connecteurs"], "q": "Lequel de ces connecteurs exprime la conséquence ?", "o": ["car", "bien que", "c’est pourquoi", "mais"], "a": 2, "e": "« C’est pourquoi » introduit le résultat. « Car » exprime la cause.", "em": "🎶"}, {"id": "fr189", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["homophones"], "q": "« Il range ___ affaires. »", "o": ["ces", "ses", "c’est", "s’est"], "a": 1, "e": "Les affaires à lui : déterminant possessif « ses ».", "em": "👯"}, {"id": "fr190", "t": "quiz", "s": "fr", "h": "Quiz", "b": "", "tags": ["conjugaison"], "q": "« Je ___ demain » (finir, futur).", "o": ["finirai", "finirais", "finissais", "finis"], "a": 0, "e": "On peut dire « nous finirons » : c’est le futur, donc -rai.", "em": "🔮"}, {"id": "ma191", "t": "fiche", "s": "ma", "h": "Relatifs et priorités opératoires", "b": "- Ordre : **parenthèses**, puis **puissances**, puis **× et ÷**, puis **+ et −**, de gauche à droite.\n- Produit de deux nombres de **même signe** : positif. De **signes contraires** : négatif.\n> −5 + 3 × (−2) = −5 + (−6) = −11", "tags": ["calcul"], "em": "➖"}, {"id": "ma192", "t": "fiche", "s": "ma", "h": "Fractions : multiplier et diviser", "b": "- Multiplier : numérateur × numérateur, dénominateur × dénominateur.\n- Diviser par une fraction = **multiplier par son inverse**.\n> (3/4) ÷ (1/2) = (3/4) × (2/1) = 6/4 = 3/2\n- Additionner : d’abord le **même dénominateur**.", "tags": ["calcul", "fractions"], "em": "🍕"}, {"id": "ma193", "t": "fiche", "s": "ma", "h": "Racine carrée", "b": "√a est le nombre positif dont le carré vaut a (a ≥ 0).\n- Carrés parfaits à connaître : 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144.\n- √(a × b) = √a × √b\n> On l’utilise surtout avec Pythagore pour trouver une longueur.", "tags": ["calcul"], "em": "🌱"}, {"id": "ma194", "t": "fiche", "s": "ma", "h": "Proportionnalité, échelle", "b": "- **Produit en croix** pour trouver une quatrième proportionnelle.\n- Graphique d’une situation de proportionnalité : **droite qui passe par l’origine**.\n- **Échelle** = distance sur le plan / distance réelle, dans la même unité.\n> Échelle 1/25 000 : 1 cm sur la carte = 25 000 cm = 250 m en réalité.", "tags": ["proportionnalité"], "em": "🗺️"}, {"id": "ma195", "t": "piege", "s": "ma", "h": "1,2 h n’est pas 1 h 20 min", "b": "Les heures ne sont pas décimales en minutes : 0,2 h = 0,2 × 60 = **12 min**. Donc 1,2 h = **1 h 12 min**.\nEt pour les vitesses : km/h → m/s, on **divise par 3,6**. 90 km/h = 25 m/s.", "tags": ["grandeurs", "automatismes"], "em": "⏱️"}, {"id": "ma196", "t": "fiche", "s": "ma", "h": "Aires et périmètres", "b": "- Rectangle : L × l ; périmètre 2 × (L + l)\n- Triangle : **(base × hauteur) / 2**\n- Disque : π × r² ; périmètre du cercle : **2 × π × r**\n- Conversions d’aires : 1 m² = **100** dm² ; de volumes : 1 m³ = **1 000** dm³.", "tags": ["géométrie", "grandeurs"], "em": "📏"}, {"id": "ma197", "t": "fiche", "s": "ma", "h": "Angles et parallèles", "b": "- Somme des angles d’un triangle : **180°**.\n- Deux droites parallèles coupées par une sécante forment des angles **alternes-internes** égaux et des angles **correspondants** égaux.\n- Réciproquement, des angles alternes-internes égaux prouvent que les droites sont parallèles.", "tags": ["géométrie"], "em": "📐"}, {"id": "ma198", "t": "fiche", "s": "ma", "h": "Triangles semblables", "b": "Deux triangles sont **semblables** s’ils ont leurs angles égaux deux à deux.\nAlors leurs côtés correspondants sont **proportionnels**.\n> Si deux angles sont égaux deux à deux, le troisième l’est aussi (somme = 180°).", "tags": ["géométrie"], "em": "📐"}, {"id": "ma199", "t": "fiche", "s": "ma", "h": "Se repérer sur la sphère terrestre", "b": "- **Latitude** : position au nord ou au sud de l’**équateur**, de 0° à 90°.\n- **Longitude** : position à l’est ou à l’ouest du **méridien de Greenwich**, de 0° à 180°.\n> Paris ≈ 49° N, 2° E. On écrit toujours latitude puis longitude.", "tags": ["géométrie", "espace"], "em": "🌐"}, {"id": "ma200", "t": "fiche", "s": "ma", "h": "Sections de solides", "b": "- Pavé coupé parallèlement à une face : un **rectangle**.\n- Cylindre coupé parallèlement à la base : un **disque**.\n- Sphère coupée par un plan : un **cercle** (disque).\n- Pyramide ou cône coupé parallèlement à la base : une **réduction** de la base.", "tags": ["géométrie", "espace"], "em": "🧊"}, {"id": "ma201", "t": "fiche", "s": "ma", "h": "Puissances : les règles", "b": "- aⁿ × aᵐ = aⁿ⁺ᵐ\n- aⁿ / aᵐ = aⁿ⁻ᵐ\n- (aⁿ)ᵐ = aⁿˣᵐ\n- a⁰ = 1 et a⁻ⁿ = 1 / aⁿ\n> Valable seulement pour la **même base**.", "tags": ["puissances"], "em": "🔟"}, {"id": "ma202", "t": "fiche", "s": "ma", "h": "Développer : simple et double distributivité", "b": "> k(a + b) = ka + kb\n> (a + b)(c + d) = ac + ad + bc + bd\nAttention aux signes : −3(x − 2) = −3x + 6.", "tags": ["calcul littéral"], "em": "✖️"}, {"id": "ma203", "t": "fiche", "s": "ma", "h": "Inéquations : le sens qui bascule", "b": "On résout comme une équation, **sauf** : si on multiplie ou divise par un nombre **négatif**, le sens de l’inégalité **change**.\n> −2x > 6 ⇔ x < −3", "tags": ["équations"], "em": "⚖️"}, {"id": "ma204", "t": "fiche", "s": "ma", "h": "Critères de divisibilité", "b": "- Par **2** : chiffre des unités pair.\n- Par **5** : se termine par 0 ou 5.\n- Par **10** : se termine par 0.\n- Par **3** : somme des chiffres divisible par 3.\n- Par **9** : somme des chiffres divisible par 9.", "tags": ["arithmétique", "automatismes"], "em": "🔢"}, {"id": "ma205", "t": "fiche", "s": "ma", "h": "Tableur : écrire une formule", "b": "- Une formule commence toujours par **=**.\n- On utilise les noms de cellules : =B2*3 ; =SOMME(B2:B10) ; =MOYENNE(B2:B10).\n- En recopiant vers le bas, B2 devient B3, B4… automatiquement.", "tags": ["algorithmique", "tableur"], "em": "💻"}, {"id": "ma206", "t": "fiche", "s": "ma", "h": "Lire un graphique de fonction", "b": "- **Image** de a : pars de a sur l’axe horizontal (abscisses), monte jusqu’à la courbe, lis sur l’axe vertical.\n- **Antécédent(s)** de b : pars de b sur l’axe vertical, va jusqu’à la courbe, lis sur l’axe horizontal. Il peut y en avoir plusieurs, ou aucun.", "tags": ["fonctions"], "em": "📈"}, {"id": "ma207", "t": "piege", "s": "ma", "h": "Aire ou périmètre ? Ne confonds pas", "b": "Le **périmètre** est une longueur (cm). L’**aire** est une surface (cm²). Pour un triangle, n’oublie pas de **diviser par 2**. Pour un disque, c’est π × r², pas 2 × π × r.", "tags": ["grandeurs"], "em": "📏"}, {"id": "ma208", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["calcul"], "q": "−5 + 3 × (−2) =", "o": ["4", "−11", "−1", "11"], "a": 1, "e": "Multiplication d’abord : 3 × (−2) = −6, puis −5 − 6 = −11.", "em": "➖"}, {"id": "ma209", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["fractions"], "q": "(3/4) ÷ (1/2) =", "o": ["3/8", "3/2", "6/8", "2/3"], "a": 1, "e": "Diviser par 1/2, c’est multiplier par 2 : 3/4 × 2 = 3/2.", "em": "🍕"}, {"id": "ma210", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["calcul"], "q": "√49 =", "o": ["7", "24,5", "−7", "4,9"], "a": 0, "e": "7 × 7 = 49.", "em": "🌱"}, {"id": "ma211", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["automatismes"], "q": "1,2 h =", "o": ["1 h 20 min", "1 h 12 min", "1 h 02 min", "72 s"], "a": 1, "e": "0,2 × 60 = 12 min.", "em": "⏱️"}, {"id": "ma212", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["grandeurs"], "q": "90 km/h en m/s :", "o": ["25 m/s", "324 m/s", "9 m/s", "15 m/s"], "a": 0, "e": "90 ÷ 3,6 = 25.", "em": "⏱️"}, {"id": "ma213", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["grandeurs"], "q": "Aire d’un disque de rayon 3 cm :", "o": ["6π cm²", "9π cm²", "3π cm²", "18π cm²"], "a": 1, "e": "π × 3² = 9π ≈ 28,3 cm².", "em": "📏"}, {"id": "ma214", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["puissances"], "q": "2³ × 2⁴ =", "o": ["2⁷", "2¹²", "4⁷", "4¹²"], "a": 0, "e": "Même base : on additionne les exposants.", "em": "🔟"}, {"id": "ma215", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["arithmétique"], "q": "Lequel est divisible par 3 ?", "o": ["124", "125", "123", "128"], "a": 2, "e": "1 + 2 + 3 = 6, divisible par 3.", "em": "🔢"}, {"id": "ma216", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["équations"], "q": "−2x > 6 équivaut à…", "o": ["x > −3", "x < −3", "x > 3", "x < 3"], "a": 1, "e": "On divise par −2 : le sens change.", "em": "⚖️"}, {"id": "ma217", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["tableur"], "q": "Quelle formule de tableur est correcte ?", "o": ["B2*3", "=B2*3", "B2×3=", "=B2x3"], "a": 1, "e": "Une formule commence par « = » et utilise * pour multiplier.", "em": "💻"}, {"id": "ma218", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["espace"], "q": "Un cylindre coupé parallèlement à sa base donne…", "o": ["un rectangle", "un disque", "un triangle", "un carré"], "a": 1, "e": "La section est une copie de la base : un disque.", "em": "🧊"}, {"id": "ma219", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["grandeurs"], "q": "1 m² =", "o": ["10 dm²", "100 dm²", "1 000 dm²", "10 000 dm²"], "a": 1, "e": "1 m = 10 dm, donc 1 m² = 10 × 10 = 100 dm².", "em": "📏"}, {"id": "ma220", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["proportionnalité"], "q": "3 cahiers coûtent 4,50 €. Combien coûtent 7 cahiers ?", "o": ["9 €", "10,50 €", "11 €", "31,50 €"], "a": 1, "e": "1 cahier = 1,50 € ; 7 × 1,50 = 10,50 €.", "em": "🗺️"}, {"id": "ma221", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["proportionnalité"], "q": "Échelle 1/25 000 : 4 cm sur la carte représentent…", "o": ["100 m", "1 km", "10 km", "250 m"], "a": 1, "e": "4 × 25 000 = 100 000 cm = 1 km.", "em": "🗺️"}, {"id": "ma222", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["calcul littéral"], "q": "Factoriser x² − 9 :", "o": ["(x − 3)²", "(x − 9)(x + 1)", "(x − 3)(x + 3)", "x(x − 9)"], "a": 2, "e": "a² − b² = (a − b)(a + b) avec b = 3.", "em": "✖️"}, {"id": "ma223", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["calcul littéral"], "q": "−3(x − 2) =", "o": ["−3x − 6", "−3x + 6", "3x − 6", "−3x − 2"], "a": 1, "e": "−3 × x = −3x et −3 × (−2) = +6.", "em": "✖️"}, {"id": "ma224", "t": "quiz", "s": "ma", "h": "Quiz", "b": "", "tags": ["géométrie"], "q": "Somme des angles d’un triangle :", "o": ["90°", "180°", "270°", "360°"], "a": 1, "e": "Toujours 180°.", "em": "📐"}, {"id": "hi225", "t": "fiche", "s": "hi", "h": "1929 : la grande crise", "b": "- **24 octobre 1929**, « jeudi noir » : krach de la Bourse de **Wall Street** à New York.\n- La crise se propage au monde : faillites, chômage de masse, misère.\n- Conséquence politique : en Europe, les **régimes autoritaires et les extrémismes** progressent, notamment en Allemagne.", "tags": ["entre-deux-guerres"], "em": "📉"}, {"id": "hi226", "t": "fiche", "s": "hi", "h": "1917 : les révolutions russes", "b": "- **Février 1917** : le tsar Nicolas II abdique.\n- **Octobre 1917** : les **bolcheviks** de **Lénine** prennent le pouvoir.\n- Guerre civile, puis création de l’**URSS** en 1922.\n- Après la mort de Lénine (1924), **Staline** s’impose et met en place un régime totalitaire.", "tags": ["XXe siècle"], "em": "🚩"}, {"id": "hi227", "t": "fiche", "s": "hi", "h": "Après 1945 : juger et reconstruire", "b": "- Plus de **60 millions de morts**, en majorité des civils.\n- **Procès de Nuremberg** (1945-1946) : on juge les dirigeants nazis ; apparition de la notion de **crime contre l’humanité**.\n- **ONU** créée en 1945 pour maintenir la paix.\n- En France : la **Sécurité sociale** est créée en 1945, la IVe République en 1946.", "tags": ["guerres mondiales"], "em": "⚖️"}, {"id": "hi228", "t": "fiche", "s": "hi", "h": "Comment commence la guerre froide", "b": "- 1947 : **doctrine Truman** (endiguer le communisme) et **plan Marshall** (aide économique américaine à l’Europe).\n- 1949 : création de l’**OTAN** ; l’Allemagne est divisée en **RFA** et **RDA**.\n- 1955 : **pacte de Varsovie** autour de l’URSS.\n> Berlin devient le symbole de la division du monde.", "tags": ["guerre froide"], "em": "🧱"}, {"id": "hi229", "t": "fiche", "s": "hi", "h": "La guerre d’Algérie", "b": "- **1er novembre 1954** : « Toussaint rouge », début de l’insurrection menée par le **FLN**.\n- Guerre violente : attentats, torture, déplacements de populations.\n- 1958 : la crise fait revenir **de Gaulle** au pouvoir.\n- **1962** : accords d’**Évian**, indépendance ; départ des pieds-noirs et drame des harkis.", "tags": ["décolonisation", "France"], "em": "🕊️"}, {"id": "hi230", "t": "fiche", "s": "hi", "h": "Le monde depuis 1989", "b": "- 1989-1991 : chute du mur, fin de l’URSS : fin de la guerre froide.\n- 2001 : attentats du **11 septembre** aux États-Unis.\n- **Nouvelles conflictualités** : terrorisme, guerres civiles, conflits pour les ressources, cyberattaques.\n- 2004 : élargissement de l’UE à 10 pays, dont d’anciens pays du bloc de l’Est.", "tags": ["monde actuel"], "em": "🌐"}, {"id": "hi231", "t": "fiche", "s": "hi", "h": "Les femmes conquièrent leurs droits", "b": "- **1944** : droit de vote et d’éligibilité ; premier vote en **1945**.\n- **1965** : une femme mariée peut travailler et ouvrir un compte sans l’autorisation de son mari.\n- **1967** : loi Neuwirth sur la contraception.\n- **1975** : loi **Veil** sur l’IVG.\n- **2000** : loi sur la **parité** en politique.", "tags": ["France", "société"], "em": "👩"}, {"id": "hi232", "t": "fiche", "s": "hi", "h": "Les présidents de la Ve République", "b": "- Charles **de Gaulle** (1959-1969)\n- Georges **Pompidou** (1969-1974)\n- Valéry **Giscard d’Estaing** (1974-1981)\n- François **Mitterrand** (1981-1995)\n- Jacques **Chirac** (1995-2007)\n- Nicolas **Sarkozy** (2007-2012)\n- François **Hollande** (2012-2017)\n- Emmanuel **Macron** (depuis 2017)", "tags": ["France", "dates"], "em": "🐓"}, {"id": "hi233", "t": "fiche", "s": "hi", "h": "Mai 1968", "b": "Révolte étudiante puis **grève générale** massive en France.\n- Les étudiants contestent l’autorité et la société de consommation.\n- Les **accords de Grenelle** augmentent fortement le salaire minimum.\n- De Gaulle dissout l’Assemblée ; il quitte le pouvoir en 1969.", "tags": ["France", "société"], "em": "📢"}, {"id": "hi234", "t": "methode", "s": "hi", "h": "Le développement construit en 4 étapes", "b": "1. **Au brouillon** : liste dates, acteurs, lieux, notions liés au sujet.\n2. **Introduction** : présente le sujet, le cadre (dates, lieux) et la question.\n3. **Deux ou trois paragraphes**, un par idée, avec des connaissances précises.\n4. **Conclusion** : réponds en une ou deux phrases.\n> Ce que le correcteur cherche : des **dates**, des **exemples** et du **vocabulaire** historique.", "tags": ["méthode", "langages"], "em": "✒️"}, {"id": "hi235", "t": "methode", "s": "hi", "h": "Analyser un document en histoire", "b": "1. **Présente** : nature, auteur, date, contexte.\n2. **Prélève** les informations utiles en citant ou décrivant.\n3. **Explique** avec tes connaissances : pourquoi, conséquences.\n4. **Critique** : le point de vue de l’auteur, les limites du document (propagande, témoignage partiel).", "tags": ["méthode", "documents"], "em": "🔍"}, {"id": "hi236", "t": "quiz", "s": "hi", "h": "Quiz", "b": "", "tags": ["entre-deux-guerres"], "q": "Le « jeudi noir » de Wall Street a lieu en…", "o": ["1918", "1929", "1933", "1945"], "a": 1, "e": "24 octobre 1929, début de la grande crise.", "em": "📉"}, {"id": "hi237", "t": "quiz", "s": "hi", "h": "Quiz", "b": "", "tags": ["XXe siècle"], "q": "En octobre 1917, le pouvoir est pris en Russie par…", "o": ["le tsar", "les bolcheviks de Lénine", "Staline seul", "les nazis"], "a": 1, "e": "Lénine et les bolcheviks prennent le pouvoir.", "em": "🚩"}, {"id": "hi238", "t": "quiz", "s": "hi", "h": "Quiz", "b": "", "tags": ["guerres mondiales"], "q": "L’ONU est créée en…", "o": ["1919", "1939", "1945", "1957"], "a": 2, "e": "En 1945, pour maintenir la paix après la guerre.", "em": "⚖️"}, {"id": "hi239", "t": "quiz", "s": "hi", "h": "Quiz", "b": "", "tags": ["guerre froide"], "q": "Le plan Marshall est…", "o": ["une alliance militaire", "une aide économique américaine à l’Europe", "un plan d’invasion", "un traité de paix avec l’URSS"], "a": 1, "e": "Lancé en 1947 pour reconstruire l’Europe et limiter l’influence communiste.", "em": "🧱"}, {"id": "hi240", "t": "quiz", "s": "hi", "h": "Quiz", "b": "", "tags": ["guerre froide"], "q": "L’OTAN est créée en…", "o": ["1945", "1949", "1955", "1961"], "a": 1, "e": "1949, alliance militaire autour des États-Unis. Le pacte de Varsovie suit en 1955.", "em": "🧱"}, {"id": "hi241", "t": "quiz", "s": "hi", "h": "Quiz", "b": "", "tags": ["guerres mondiales"], "q": "Le procès de Nuremberg fait apparaître la notion de…", "o": ["guerre totale", "crime contre l’humanité", "guerre froide", "décolonisation"], "a": 1, "e": "Les dirigeants nazis y sont jugés pour crimes contre l’humanité.", "em": "⚖️"}, {"id": "hi242", "t": "quiz", "s": "hi", "h": "Quiz", "b": "", "tags": ["société"], "q": "Les Françaises votent pour la première fois en…", "o": ["1936", "1945", "1958", "1968"], "a": 1, "e": "Droit accordé en 1944, premier vote en 1945.", "em": "👩"}, {"id": "hi243", "t": "quiz", "s": "hi", "h": "Quiz", "b": "", "tags": ["France"], "q": "La rafle du Vél d’Hiv a lieu en…", "o": ["1940", "1942", "1944", "1945"], "a": 1, "e": "16 et 17 juillet 1942, à Paris, menée par la police française.", "em": "📻"}, {"id": "hi244", "t": "quiz", "s": "hi", "h": "Quiz", "b": "", "tags": ["France"], "q": "Qui est élu président de la République en 1981 ?", "o": ["Chirac", "Giscard d’Estaing", "Mitterrand", "Pompidou"], "a": 2, "e": "François Mitterrand, qui fait abolir la peine de mort la même année.", "em": "🐓"}, {"id": "hi245", "t": "quiz", "s": "hi", "h": "Quiz", "b": "", "tags": ["guerres mondiales"], "q": "La bataille de Verdun a lieu en…", "o": ["1914", "1916", "1918", "1940"], "a": 1, "e": "De février à décembre 1916.", "em": "🪖"}, {"id": "hi246", "t": "quiz", "s": "hi", "h": "Quiz", "b": "", "tags": ["guerre froide"], "q": "La crise des missiles de Cuba éclate en…", "o": ["1948", "1956", "1962", "1989"], "a": 2, "e": "Octobre 1962, le moment où la guerre froide frôle la guerre nucléaire.", "em": "🧱"}, {"id": "hi247", "t": "quiz", "s": "hi", "h": "Quiz", "b": "", "tags": ["décolonisation"], "q": "La guerre d’Algérie commence en…", "o": ["1945", "1954", "1958", "1962"], "a": 1, "e": "Le 1er novembre 1954, la « Toussaint rouge ».", "em": "🕊️"}, {"id": "ge248", "t": "fiche", "s": "ge", "h": "Les métropoles françaises", "b": "- **Paris** : ville mondiale, qui concentre pouvoirs politiques, économiques et culturels.\n- **Métropoles régionales** : Lyon, Marseille, Toulouse, Lille, Bordeaux, Nantes, Strasbourg…\n- La métropolisation renforce les grandes villes, au risque d’accentuer les écarts avec les petites villes et les campagnes.", "tags": ["urbain"], "em": "🏙️"}, {"id": "ge249", "t": "fiche", "s": "ge", "h": "Inégalités dans la ville", "b": "- **Quartiers prioritaires** : chômage plus élevé, logements dégradés ; la **politique de la ville** cherche à les rénover.\n- **Gentrification** : des ménages plus aisés s’installent dans d’anciens quartiers populaires, les prix montent.\n- Enjeux : mixité sociale, transports, logement.", "tags": ["urbain", "aménagement"], "em": "🏙️"}, {"id": "ge250", "t": "fiche", "s": "ge", "h": "Les mobilités", "b": "- **Migrations pendulaires** : trajets quotidiens domicile-travail.\n- Réseaux : autoroutes, **LGV**, aéroports ; Roissy-Charles-de-Gaulle est un **hub** international.\n- Enjeu actuel : réduire la place de la voiture (transports en commun, vélo, covoiturage).", "tags": ["mobilités"], "em": "🚆"}, {"id": "ge251", "t": "fiche", "s": "ge", "h": "Les espaces agricoles", "b": "- Agriculture **productive** et mécanisée : céréales du Bassin parisien.\n- **PAC** (politique agricole commune) : aides européennes aux agriculteurs.\n- Nouvelles tendances : agriculture **biologique**, **circuits courts**, labels de qualité (AOP).", "tags": ["économie"], "em": "🚜"}, {"id": "ge252", "t": "fiche", "s": "ge", "h": "Industrie et tourisme", "b": "- **Désindustrialisation** des vieilles régions industrielles, reconversion.\n- Pôles dynamiques : **aéronautique à Toulouse**, chimie, agroalimentaire.\n- La France est l’une des **premières destinations touristiques mondiales** : Paris, littoraux, montagnes, patrimoine.", "tags": ["économie"], "em": "🏭"}, {"id": "ge253", "t": "fiche", "s": "ge", "h": "Littoraux et montagnes : espaces convoités", "b": "- **Littoralisation** : population et activités se concentrent sur les côtes.\n- **Conflits d’usage** : tourisme, pêche, industrie, protection de la nature.\n- Protection : **loi Littoral** (1986), **loi Montagne** (1985), parcs nationaux.", "tags": ["territoires", "aménagement"], "em": "🏔️"}, {"id": "ge254", "t": "fiche", "s": "ge", "h": "Régions transfrontalières", "b": "Aux frontières, la coopération se développe : travailleurs frontaliers, transports, projets communs.\n> Exemple : l’**Eurorégion Pyrénées-Méditerranée** associe l’Occitanie, la Catalogne et les îles Baléares.", "tags": ["Europe"], "em": "🤝"}, {"id": "ge255", "t": "fiche", "s": "ge", "h": "Les outre-mer dans l’Union européenne", "b": "Les DROM sont des **régions ultrapériphériques (RUP)** de l’Union européenne : ils font partie de l’UE malgré leur éloignement et reçoivent des **fonds européens** pour compenser leurs handicaps.", "tags": ["outre-mer", "Europe"], "em": "🏝️"}, {"id": "ge256", "t": "fiche", "s": "ge", "h": "Le développement durable", "b": "Un développement qui répond aux besoins d’aujourd’hui **sans compromettre** ceux des générations futures.\n- 3 piliers : **économique**, **social**, **environnemental**.\n> Au brevet, montre comment un aménagement concilie les trois.", "tags": ["aménagement"], "em": "♻️"}, {"id": "ge257", "t": "fiche", "s": "ge", "h": "Les régions françaises", "b": "- **13 régions** en France métropolitaine depuis 2016, plus les régions d’outre-mer.\n- La région est une **collectivité territoriale** : elle gère les lycées, les transports régionaux, le développement économique.\n- Le département gère les collèges, la commune les écoles.", "tags": ["aménagement", "institutions"], "em": "🗺️"}, {"id": "ge258", "t": "methode", "s": "ge", "h": "Décrire un paysage", "b": "1. Repère les **plans** : premier plan (le plus proche), second plan, arrière-plan.\n2. Décris ce qui est **naturel** (relief, eau, végétation) et ce qui est **humain** (habitat, routes, champs, industrie).\n3. Explique : quelles activités, quels aménagements, quels enjeux ?", "tags": ["méthode", "documents"], "em": "🏞️"}, {"id": "ge259", "t": "quiz", "s": "ge", "h": "Quiz", "b": "", "tags": ["mobilités"], "q": "Un trajet quotidien domicile-travail est une migration…", "o": ["saisonnière", "pendulaire", "internationale", "définitive"], "a": 1, "e": "Aller-retour chaque jour : migration pendulaire.", "em": "🚆"}, {"id": "ge260", "t": "quiz", "s": "ge", "h": "Quiz", "b": "", "tags": ["aménagement"], "q": "La loi Littoral date de…", "o": ["1958", "1986", "2002", "2020"], "a": 1, "e": "1986, pour protéger les côtes de l’urbanisation.", "em": "🏔️"}, {"id": "ge261", "t": "quiz", "s": "ge", "h": "Quiz", "b": "", "tags": ["aménagement"], "q": "Les 3 piliers du développement durable :", "o": ["économique, social, environnemental", "agricole, industriel, touristique", "local, national, mondial", "public, privé, associatif"], "a": 0, "e": "Concilier économie, société et environnement.", "em": "♻️"}, {"id": "ge262", "t": "quiz", "s": "ge", "h": "Quiz", "b": "", "tags": ["économie"], "q": "Ville française de l’industrie aéronautique :", "o": ["Lille", "Toulouse", "Brest", "Dijon"], "a": 1, "e": "Toulouse, siège d’Airbus.", "em": "🏭"}, {"id": "ge263", "t": "quiz", "s": "ge", "h": "Quiz", "b": "", "tags": ["économie"], "q": "La PAC est…", "o": ["un parc national", "la politique agricole commune de l’UE", "un port", "un plan d’urbanisme"], "a": 1, "e": "Elle aide et encadre l’agriculture européenne.", "em": "🚜"}, {"id": "ge264", "t": "quiz", "s": "ge", "h": "Quiz", "b": "", "tags": ["institutions"], "q": "Combien de régions en France métropolitaine ?", "o": ["13", "18", "22", "101"], "a": 0, "e": "13 depuis 2016 ; 18 avec les régions d’outre-mer.", "em": "🗺️"}, {"id": "ge265", "t": "quiz", "s": "ge", "h": "Quiz", "b": "", "tags": ["outre-mer"], "q": "Les DROM sont, pour l’UE, des…", "o": ["pays tiers", "régions ultrapériphériques", "territoires hors UE", "zones de libre-échange"], "a": 1, "e": "Ils font partie de l’UE et reçoivent des aides spécifiques.", "em": "🏝️"}, {"id": "ge266", "t": "quiz", "s": "ge", "h": "Quiz", "b": "", "tags": ["méthode"], "q": "Dans un paysage, le premier plan est…", "o": ["le plus éloigné", "le plus proche", "le ciel", "le centre"], "a": 1, "e": "Le premier plan est la partie la plus proche de l’observateur.", "em": "🏞️"}, {"id": "ge267", "t": "quiz", "s": "ge", "h": "Quiz", "b": "", "tags": ["mobilités"], "q": "Roissy-Charles-de-Gaulle est…", "o": ["un port", "un hub aéroportuaire", "un technopôle", "une LGV"], "a": 1, "e": "Un aéroport qui redistribue les flux de voyageurs dans le monde.", "em": "🚆"}, {"id": "emc268", "t": "fiche", "s": "emc", "h": "Les textes qui fondent nos droits", "b": "- **Déclaration des droits de l’homme et du citoyen** (1789) : liberté, égalité en droits, propriété, résistance à l’oppression.\n- **Constitution de 1958** : organise la Ve République.\n- **Déclaration universelle des droits de l’homme** (ONU, 1948).\n- **Convention internationale des droits de l’enfant** (ONU, 1989).", "tags": ["droits"], "em": "📜"}, {"id": "emc269", "t": "fiche", "s": "emc", "h": "La justice en France", "b": "- **Présomption d’innocence** : toute personne est innocente tant que sa culpabilité n’est pas prouvée.\n- Droit à un **avocat** et à un procès équitable.\n- Justice **civile** (conflits entre personnes) et **pénale** (infractions punies par la loi).\n- Les mineurs relèvent d’une justice adaptée, avec le **juge des enfants**.", "tags": ["justice"], "em": "⚖️"}, {"id": "emc270", "t": "fiche", "s": "emc", "h": "Les discriminations sont interdites", "b": "Discriminer, c’est traiter quelqu’un **moins bien** à cause d’un critère interdit par la loi : origine, sexe, handicap, religion, orientation sexuelle, âge, apparence… La loi en liste plus de 25.\n> C’est un **délit** puni par la loi. On peut saisir le **Défenseur des droits**.", "tags": ["égalité"], "em": "✋"}, {"id": "emc271", "t": "fiche", "s": "emc", "h": "Harcèlement : ce que dit la loi", "b": "- Le harcèlement scolaire est un **délit**, y compris en ligne.\n- Signes : moqueries répétées, exclusion, rumeurs, messages humiliants.\n- Que faire : en parler à un adulte, garder des captures d’écran, appeler le **3018** (gratuit, anonyme).\n> Témoin, tu as un rôle : ne pas rire, ne pas partager, alerter.", "tags": ["harcèlement"], "em": "🛑"}, {"id": "emc272", "t": "fiche", "s": "emc", "h": "Liberté d’expression : jusqu’où ?", "b": "La liberté d’expression est garantie, mais elle a des **limites** fixées par la loi :\n- **injure** et **diffamation** ;\n- **incitation à la haine** ou à la violence ;\n- apologie du terrorisme.\n> On peut critiquer des idées, pas attaquer des personnes.", "tags": ["libertés"], "em": "💬"}, {"id": "emc273", "t": "fiche", "s": "emc", "h": "Vérifier une information", "b": "1. **Qui** publie ? Un média identifié, un compte anonyme ?\n2. **Quand** ? Une vieille info peut ressortir.\n3. **Croise** avec d’autres sources fiables.\n4. Image : recherche inversée pour retrouver son origine.\n> Une info très choquante qui circule vite mérite toujours une vérification.", "tags": ["médias"], "em": "📰"}, {"id": "emc274", "t": "fiche", "s": "emc", "h": "S’engager dès maintenant", "b": "- Délégué de classe, éco-délégué, conseil de la vie collégienne.\n- Associations, bénévolat, clubs sportifs.\n- **Service civique** possible dès **16 ans**.\n- Citoyen européen : un Européen qui vit en France peut voter aux élections **municipales** et **européennes**.", "tags": ["engagement", "citoyenneté"], "em": "🗳️"}, {"id": "emc275", "t": "fiche", "s": "emc", "h": "Le Conseil constitutionnel", "b": "Il vérifie que les **lois respectent la Constitution**. Une loi jugée contraire ne peut pas s’appliquer.\nIl contrôle aussi la régularité des élections nationales.", "tags": ["institutions"], "em": "📜"}, {"id": "emc276", "t": "quiz", "s": "emc", "h": "Quiz", "b": "", "tags": ["droits"], "q": "La Déclaration des droits de l’homme et du citoyen date de…", "o": ["1789", "1848", "1905", "1958"], "a": 0, "e": "26 août 1789, au début de la Révolution française.", "em": "🗳️"}, {"id": "emc277", "t": "quiz", "s": "emc", "h": "Quiz", "b": "", "tags": ["droits"], "q": "La Convention internationale des droits de l’enfant date de…", "o": ["1948", "1989", "2000", "1975"], "a": 1, "e": "Adoptée par l’ONU en 1989.", "em": "📜"}, {"id": "emc278", "t": "quiz", "s": "emc", "h": "Quiz", "b": "", "tags": ["harcèlement"], "q": "Le numéro gratuit contre le harcèlement :", "o": ["3018", "112", "17", "3919"], "a": 0, "e": "Le 3018, gratuit et anonyme, aussi pour le cyberharcèlement.", "em": "🛑"}, {"id": "emc279", "t": "quiz", "s": "emc", "h": "Quiz", "b": "", "tags": ["institutions"], "q": "Le Conseil constitutionnel…", "o": ["vote les lois", "vérifie que les lois respectent la Constitution", "élit le Président", "juge les élèves"], "a": 1, "e": "Il contrôle la conformité des lois à la Constitution.", "em": "📜"}, {"id": "emc280", "t": "quiz", "s": "emc", "h": "Quiz", "b": "", "tags": ["justice"], "q": "La présomption d’innocence signifie…", "o": ["l’accusé doit prouver qu’il est innocent", "on est innocent tant que la culpabilité n’est pas prouvée", "les mineurs ne sont jamais jugés", "le juge ne peut pas condamner"], "a": 1, "e": "C’est à l’accusation de prouver la culpabilité.", "em": "⚖️"}, {"id": "emc281", "t": "quiz", "s": "emc", "h": "Quiz", "b": "", "tags": ["engagement"], "q": "Le service civique est possible à partir de…", "o": ["14 ans", "16 ans", "18 ans", "21 ans"], "a": 1, "e": "Dès 16 ans, jusqu’à 25 ans (30 ans en situation de handicap).", "em": "🙋"}, {"id": "emc282", "t": "quiz", "s": "emc", "h": "Quiz", "b": "", "tags": ["citoyenneté"], "q": "Une Italienne qui vit en France peut voter aux élections…", "o": ["présidentielles", "législatives", "municipales", "à aucune élection"], "a": 2, "e": "Citoyenne européenne : municipales et européennes.", "em": "🗳️"}, {"id": "emc283", "t": "quiz", "s": "emc", "h": "Quiz", "b": "", "tags": ["médias"], "q": "Pour vérifier une information, le meilleur réflexe :", "o": ["regarder le nombre de partages", "croiser plusieurs sources fiables", "lire seulement le titre", "faire confiance à un ami"], "a": 1, "e": "Le nombre de partages ne prouve rien.", "em": "📰"}, {"id": "emc284", "t": "quiz", "s": "emc", "h": "Quiz", "b": "", "tags": ["égalité"], "q": "Refuser un stage à quelqu’un à cause de son origine, c’est…", "o": ["légal", "une discrimination punie par la loi", "une opinion", "une injure"], "a": 1, "e": "L’origine est un critère de discrimination interdit.", "em": "✋"}, {"id": "pc285", "t": "fiche", "s": "pc", "h": "Les changements d’état", "b": "- Solide → liquide : **fusion** ; liquide → solide : **solidification**.\n- Liquide → gaz : **vaporisation** ; gaz → liquide : **liquéfaction**.\n- Solide → gaz : **sublimation**.\n- Pour un **corps pur**, la température reste constante pendant le changement d’état (palier). L’eau : fusion à 0 °C, ébullition à 100 °C.\n> La masse se conserve, le volume peut changer.", "tags": ["matière"], "em": "🧊"}, {"id": "pc286", "t": "fiche", "s": "pc", "h": "Lire une formule chimique", "b": "- H₂O : 2 atomes d’hydrogène, 1 d’oxygène.\n- CO₂ : 1 carbone, 2 oxygènes.\n- O₂ : 2 atomes d’oxygène.\n- CH₄ (méthane) : 1 carbone, 4 hydrogènes.\n> Le chiffre en indice s’applique à l’atome juste avant.", "tags": ["chimie"], "em": "💧"}, {"id": "pc287", "t": "fiche", "s": "pc", "h": "Les 4 tests chimiques à connaître", "b": "- **Eau** : le sulfate de cuivre anhydre passe du blanc au **bleu**.\n- **Dioxyde de carbone** : l’eau de chaux se **trouble**.\n- **Dioxygène** : il ravive une bûchette **incandescente**.\n- **Dihydrogène** : petite **détonation** à l’approche d’une flamme.", "tags": ["chimie"], "em": "🧪"}, {"id": "pc288", "t": "fiche", "s": "pc", "h": "Mélanges et solutions", "b": "- **Soluble** : un solide se dissout dans un liquide (le sel dans l’eau). **Miscible** : deux liquides se mélangent.\n- Mélange **homogène** : on ne distingue qu’une seule phase.\n- Lors d’une dissolution, la **masse totale se conserve**.", "tags": ["matière"], "em": "🥤"}, {"id": "pc289", "t": "fiche", "s": "pc", "h": "Le tableau périodique", "b": "Les éléments sont classés par **numéro atomique Z**, le nombre de **protons** du noyau.\n> Z(H) = 1, Z(C) = 6, Z(O) = 8.\nUn élément garde le même Z, qu’il soit atome ou ion.", "tags": ["matière"], "em": "🧮"}, {"id": "pc290", "t": "fiche", "s": "pc", "h": "Facture d’électricité : le kWh", "b": "> E (kWh) = P (kW) × t (h)\nUn radiateur de 2 kW allumé 3 h consomme 2 × 3 = **6 kWh**. Le fournisseur facture chaque kWh consommé.", "tags": ["énergie", "électricité"], "em": "🧾"}, {"id": "pc291", "t": "fiche", "s": "pc", "h": "Sécurité électrique", "b": "- **Court-circuit** : le courant passe sans traverser d’appareil, l’intensité explose, risque d’incendie.\n- **Fusible** et **disjoncteur** coupent le circuit en cas de surintensité.\n- La **prise de terre** protège des électrocutions.\n> Jamais d’appareil électrique près de l’eau.", "tags": ["électricité"], "em": "⚠️"}, {"id": "pc292", "t": "fiche", "s": "pc", "h": "Sources d’énergie", "b": "- **Renouvelables** : solaire, éolien, hydraulique, biomasse, géothermie.\n- **Non renouvelables** : pétrole, gaz, charbon (fossiles) et **uranium** (nucléaire).\n> Les fossiles émettent du CO₂, un gaz à effet de serre.", "tags": ["énergie"], "em": "🌞"}, {"id": "pc293", "t": "fiche", "s": "pc", "h": "Énergie de position et chute", "b": "- **Énergie de position** (potentielle) : augmente avec l’altitude.\n- Pendant une chute, l’énergie de position se convertit en **énergie cinétique** : l’objet accélère.\n- Énergie mécanique = énergie cinétique + énergie de position.", "tags": ["énergie"], "em": "🪂"}, {"id": "pc294", "t": "fiche", "s": "pc", "h": "La lumière", "b": "- Dans un milieu homogène, la lumière se propage en **ligne droite**.\n- La lumière blanche est un **mélange de couleurs** : un prisme la décompose (spectre, comme un arc-en-ciel).\n- Un objet nous paraît coloré selon les couleurs qu’il **diffuse**.", "tags": ["signaux"], "em": "🌈"}, {"id": "pc295", "t": "methode", "s": "pc", "h": "Résoudre un exercice de physique", "b": "1. Relève les **données** avec leurs unités.\n2. Écris la **formule** littérale.\n3. **Convertis** si nécessaire (mA → A, min → s, g → kg).\n4. Remplace : application numérique.\n5. Résultat avec **unité** et une phrase de conclusion.", "tags": ["méthode"], "em": "📏"}, {"id": "pc296", "t": "piege", "s": "pc", "h": "Les unités qui font tout rater", "b": "- 250 mA = **0,25 A**\n- 2 kΩ = **2 000 Ω**\n- 1 h = **3 600 s**\n- Dans Ec = ½ m v² : m en **kg** et v en **m/s**, sinon le résultat est faux.", "tags": ["méthode"], "em": "📏"}, {"id": "pc297", "t": "quiz", "s": "pc", "h": "Quiz", "b": "", "tags": ["chimie"], "q": "Combien d’atomes dans une molécule d’eau H₂O ?", "o": ["2", "3", "4", "1"], "a": 1, "e": "2 hydrogènes + 1 oxygène = 3 atomes.", "em": "⚛️"}, {"id": "pc298", "t": "quiz", "s": "pc", "h": "Quiz", "b": "", "tags": ["chimie"], "q": "Quel gaz ravive une bûchette incandescente ?", "o": ["dioxyde de carbone", "dioxygène", "diazote", "dihydrogène"], "a": 1, "e": "Le dioxygène entretient la combustion.", "em": "🧪"}, {"id": "pc299", "t": "quiz", "s": "pc", "h": "Quiz", "b": "", "tags": ["matière"], "q": "Le passage de liquide à gaz s’appelle…", "o": ["fusion", "vaporisation", "liquéfaction", "solidification"], "a": 1, "e": "Vaporisation (ébullition ou évaporation).", "em": "🧊"}, {"id": "pc300", "t": "quiz", "s": "pc", "h": "Quiz", "b": "", "tags": ["énergie"], "q": "Un appareil de 2 kW fonctionne 3 h. Énergie consommée ?", "o": ["5 kWh", "6 kWh", "1,5 kWh", "6 000 kWh"], "a": 1, "e": "E = P × t = 2 × 3 = 6 kWh.", "em": "🧾"}, {"id": "pc301", "t": "quiz", "s": "pc", "h": "Quiz", "b": "", "tags": ["énergie"], "q": "Laquelle est une énergie non renouvelable ?", "o": ["éolienne", "solaire", "uranium", "hydraulique"], "a": 2, "e": "Le stock d’uranium est limité.", "em": "🌞"}, {"id": "pc302", "t": "quiz", "s": "pc", "h": "Quiz", "b": "", "tags": ["matière"], "q": "Le numéro atomique Z correspond au nombre de…", "o": ["neutrons", "protons", "électrons perdus", "molécules"], "a": 1, "e": "Z = nombre de protons du noyau.", "em": "⚛️"}, {"id": "pc303", "t": "quiz", "s": "pc", "h": "Quiz", "b": "", "tags": ["électricité"], "q": "250 mA =", "o": ["2,5 A", "0,25 A", "25 A", "0,025 A"], "a": 1, "e": "1 A = 1 000 mA.", "em": "🔌"}, {"id": "pc304", "t": "quiz", "s": "pc", "h": "Quiz", "b": "", "tags": ["énergie"], "q": "Pendant une chute, l’énergie de position se convertit en…", "o": ["énergie chimique", "énergie cinétique", "énergie nucléaire", "rien"], "a": 1, "e": "L’objet perd de l’altitude et gagne de la vitesse.", "em": "🪂"}, {"id": "pc305", "t": "quiz", "s": "pc", "h": "Quiz", "b": "", "tags": ["signaux"], "q": "Un prisme qui décompose la lumière blanche montre qu’elle est…", "o": ["une seule couleur", "un mélange de couleurs", "un son", "invisible"], "a": 1, "e": "On obtient un spectre continu.", "em": "🌈"}, {"id": "pc306", "t": "quiz", "s": "pc", "h": "Quiz", "b": "", "tags": ["matière"], "q": "Pendant la fusion de la glace pure, la température…", "o": ["monte", "descend", "reste constante", "varie au hasard"], "a": 2, "e": "Palier à 0 °C pour un corps pur.", "em": "🧊"}, {"id": "pc307", "t": "quiz", "s": "pc", "h": "Quiz", "b": "", "tags": ["chimie"], "q": "Le sulfate de cuivre anhydre devient bleu en présence…", "o": ["de dioxygène", "d’eau", "de CO₂", "de lumière"], "a": 1, "e": "C’est le test de l’eau.", "em": "🧪"}, {"id": "svt308", "t": "fiche", "s": "svt", "h": "Les groupes sanguins : génétique en action", "b": "Le gène du groupe sanguin a 3 allèles : **A**, **B** (dominants) et **O** (récessif).\n- A//O → groupe **A** ; B//O → groupe **B**.\n- A//B → groupe **AB** (codominance).\n- O//O → groupe **O**.\n> Un allèle récessif ne s’exprime que s’il est présent en double.", "tags": ["génétique"], "em": "🩸"}, {"id": "svt309", "t": "fiche", "s": "svt", "h": "La photosynthèse", "b": "Les végétaux **chlorophylliens** fabriquent leur matière organique à partir de :\n> CO₂ + eau + lumière → matière organique + **dioxygène**\nIls sont des **producteurs** : à la base de toutes les chaînes alimentaires.", "tags": ["écosystèmes"], "em": "🌿"}, {"id": "svt310", "t": "fiche", "s": "svt", "h": "Chaînes alimentaires et décomposeurs", "b": "- **Producteurs** (végétaux) → **consommateurs** (herbivores, carnivores).\n- La flèche signifie « est mangé par ».\n- **Décomposeurs** (bactéries, champignons, vers de terre) recyclent la matière morte en sels minéraux.", "tags": ["écosystèmes"], "em": "🍄"}, {"id": "svt311", "t": "fiche", "s": "svt", "h": "La biodiversité en danger", "b": "La biodiversité, c’est la diversité des **écosystèmes**, des **espèces** et des **gènes**.\nMenaces principales : **destruction des habitats**, **surexploitation**, **pollutions**, **espèces invasives**, **changement climatique**.", "tags": ["biodiversité"], "em": "🐝"}, {"id": "svt312", "t": "fiche", "s": "svt", "h": "Météo, climat, effet de serre", "b": "- **Météo** : le temps qu’il fait à un moment donné. **Climat** : moyennes sur au moins **30 ans**.\n- **Effet de serre** : des gaz (CO₂, méthane, vapeur d’eau) retiennent la chaleur ; il est naturel et vital.\n- Les activités humaines l’**amplifient** (combustibles fossiles, déforestation, élevage) : c’est le réchauffement climatique actuel, établi par le **GIEC**.", "tags": ["climat"], "em": "🌡️"}, {"id": "svt313", "t": "fiche", "s": "svt", "h": "Le temps long de la Terre", "b": "- Âge de la Terre : environ **4,6 milliards d’années**.\n- Les **fossiles** permettent de dater les roches et de suivre l’évolution.\n- Crises biologiques : il y a **66 millions d’années**, la disparition des dinosaures non aviens.", "tags": ["évolution", "géologie"], "em": "🦎"}, {"id": "svt314", "t": "fiche", "s": "svt", "h": "Puberté et reproduction", "b": "- À la puberté, des **hormones** déclenchent la production des cellules reproductrices : spermatozoïdes chez le garçon, ovulation chez la fille.\n- Chez la femme, le **cycle** dure environ 28 jours ; l’ovulation a lieu vers le milieu.\n- La fécondation donne une **cellule-œuf**.", "tags": ["reproduction"], "em": "🌱"}, {"id": "svt315", "t": "fiche", "s": "svt", "h": "Asepsie et antisepsie", "b": "- **Asepsie** : éviter l’entrée des micro-organismes (matériel stérile, mains lavées).\n- **Antisepsie** : détruire les micro-organismes sur une plaie (désinfectant).\n- Le **microbiote** intestinal, lui, est formé de bactéries utiles à la digestion et à l’immunité.", "tags": ["santé", "immunité"], "em": "💉"}, {"id": "svt316", "t": "methode", "s": "svt", "h": "La démarche scientifique", "b": "1. **Problème** : la question posée.\n2. **Hypothèse** : une réponse possible à tester.\n3. **Expérience** : on ne change qu’**un seul paramètre** à la fois, avec une **expérience témoin**.\n4. **Résultats**, puis **conclusion** : l’hypothèse est validée ou rejetée.", "tags": ["méthode"], "em": "🔬"}, {"id": "svt317", "t": "quiz", "s": "svt", "h": "Quiz", "b": "", "tags": ["écosystèmes"], "q": "La photosynthèse rejette…", "o": ["du CO₂", "du dioxygène", "du méthane", "de l’azote"], "a": 1, "e": "Les végétaux chlorophylliens libèrent du dioxygène.", "em": "🌿"}, {"id": "svt318", "t": "quiz", "s": "svt", "h": "Quiz", "b": "", "tags": ["écosystèmes"], "q": "Les vers de terre et les champignons du sol sont des…", "o": ["producteurs", "décomposeurs", "prédateurs", "parasites"], "a": 1, "e": "Ils recyclent la matière morte.", "em": "🍄"}, {"id": "svt319", "t": "quiz", "s": "svt", "h": "Quiz", "b": "", "tags": ["géologie"], "q": "L’âge de la Terre est d’environ…", "o": ["6 000 ans", "4,6 millions d’années", "4,6 milliards d’années", "66 millions d’années"], "a": 2, "e": "Environ 4,6 milliards d’années.", "em": "🦕"}, {"id": "svt320", "t": "quiz", "s": "svt", "h": "Quiz", "b": "", "tags": ["méthode"], "q": "Dans une expérience, on fait varier…", "o": ["tous les paramètres", "un seul paramètre à la fois", "aucun paramètre", "le résultat"], "a": 1, "e": "Sinon on ne sait pas quel paramètre explique le résultat.", "em": "🔬"}, {"id": "svt321", "t": "quiz", "s": "svt", "h": "Quiz", "b": "", "tags": ["génétique"], "q": "Une personne A//O est du groupe…", "o": ["A", "O", "AB", "B"], "a": 0, "e": "A est dominant sur O.", "em": "🩸"}, {"id": "svt322", "t": "quiz", "s": "svt", "h": "Quiz", "b": "", "tags": ["climat"], "q": "Le climat se définit sur une période d’au moins…", "o": ["1 jour", "1 an", "30 ans", "1 000 ans"], "a": 2, "e": "Moyennes sur 30 ans au minimum.", "em": "🌡️"}, {"id": "svt323", "t": "quiz", "s": "svt", "h": "Quiz", "b": "", "tags": ["évolution"], "q": "Les dinosaures non aviens disparaissent il y a…", "o": ["66 millions d’années", "6 600 ans", "4,6 milliards d’années", "2 millions d’années"], "a": 0, "e": "Crise biologique de la fin du Crétacé.", "em": "🦎"}, {"id": "svt324", "t": "quiz", "s": "svt", "h": "Quiz", "b": "", "tags": ["santé"], "q": "Désinfecter une plaie, c’est de…", "o": ["l’asepsie", "l’antisepsie", "la vaccination", "la phagocytose"], "a": 1, "e": "Antisepsie : détruire les microbes sur un tissu vivant.", "em": "🧼"}, {"id": "svt325", "t": "quiz", "s": "svt", "h": "Quiz", "b": "", "tags": ["climat"], "q": "Principal gaz à effet de serre émis par les activités humaines :", "o": ["dioxygène", "diazote", "dioxyde de carbone", "hélium"], "a": 2, "e": "Le CO₂, surtout issu des combustibles fossiles.", "em": "🌡️"}, {"id": "te326", "t": "fiche", "s": "te", "h": "Données personnelles et RGPD", "b": "- Donnée personnelle : tout ce qui permet de t’identifier (nom, photo, adresse IP, localisation).\n- Le **RGPD** (2018) protège ces données dans l’Union européenne : consentement, droit d’accès, droit à l’effacement.\n- En France, la **CNIL** veille à son application.", "tags": ["numérique", "citoyenneté"], "em": "🔐"}, {"id": "te327", "t": "fiche", "s": "te", "h": "Cybersécurité : les bons réflexes", "b": "- Mot de passe **long** (12 caractères ou plus), **unique** pour chaque compte.\n- **Double authentification** dès que possible.\n- **HTTPS** et cadenas : la connexion est **chiffrée**.\n- Méfie-toi des liens reçus par message (hameçonnage).", "tags": ["numérique"], "em": "🔑"}, {"id": "te328", "t": "fiche", "s": "te", "h": "Objets connectés", "b": "Un objet connecté possède des **capteurs**, une **carte programmable** et une **interface de communication** (Wi-Fi, Bluetooth) pour échanger des données.\n> Exemples : montre connectée, thermostat, station météo.", "tags": ["systèmes", "réseaux"], "em": "📡"}, {"id": "te329", "t": "fiche", "s": "te", "h": "Du croquis au prototype", "b": "1. Croquis et recherche de solutions.\n2. **CAO** : modélisation 3D sur ordinateur, **simulation** pour tester avant de fabriquer.\n3. **Prototype** : premier exemplaire pour valider.\n- L’**impression 3D** est une fabrication **additive** (on dépose de la matière couche par couche).", "tags": ["conception"], "em": "🖨️"}, {"id": "te330", "t": "fiche", "s": "te", "h": "Invention, innovation, évolution des objets", "b": "- **Invention** : création d’un objet ou d’un principe nouveau.\n- **Innovation** : amélioration d’un objet existant qui arrive sur le marché.\n- Une **lignée d’objets** montre l’évolution d’un objet dans le temps selon les besoins, les matériaux et les techniques.", "tags": ["conception"], "em": "💡"}, {"id": "te331", "t": "fiche", "s": "te", "h": "Stocker l’énergie", "b": "- Une **batterie** stocke l’énergie sous forme **chimique** et la restitue sous forme électrique.\n- Capacité en **mAh** ou énergie en **Wh**.\n- Autres stockages : barrages (énergie de position de l’eau), volants d’inertie.", "tags": ["énergie"], "em": "🔋"}, {"id": "te332", "t": "fiche", "s": "te", "h": "Écoconception", "b": "Concevoir un objet en réduisant son impact à **toutes les étapes du cycle de vie** : moins de matière, matériaux recyclés ou recyclables, réparabilité, faible consommation, démontage facile.", "tags": ["environnement"], "em": "🌱"}, {"id": "te333", "t": "quiz", "s": "te", "h": "Quiz", "b": "", "tags": ["numérique"], "q": "Le cadenas HTTPS indique que…", "o": ["le site est gratuit", "la connexion est chiffrée", "le site est sans publicité", "le site est officiel"], "a": 1, "e": "Chiffrée ne veut pas dire fiable : vérifie aussi l’adresse.", "em": "🔑"}, {"id": "te334", "t": "quiz", "s": "te", "h": "Quiz", "b": "", "tags": ["numérique"], "q": "Le RGPD protège…", "o": ["les brevets d’invention", "les données personnelles", "les matériaux", "les réseaux électriques"], "a": 1, "e": "Règlement européen de 2018.", "em": "🔐"}, {"id": "te335", "t": "quiz", "s": "te", "h": "Quiz", "b": "", "tags": ["conception"], "q": "L’impression 3D est une fabrication…", "o": ["soustractive", "additive", "par moulage", "par pliage"], "a": 1, "e": "On ajoute de la matière couche par couche.", "em": "🖨️"}, {"id": "te336", "t": "quiz", "s": "te", "h": "Quiz", "b": "", "tags": ["conception"], "q": "Améliorer un objet existant et le commercialiser, c’est…", "o": ["une invention", "une innovation", "un prototype", "un brevet"], "a": 1, "e": "L’innovation fait évoluer un produit existant.", "em": "💡"}, {"id": "te337", "t": "quiz", "s": "te", "h": "Quiz", "b": "", "tags": ["numérique"], "q": "Le mot de passe le plus solide :", "o": ["123456", "prenom2010", "Tr0mp3tte-Lune-Kiwi!", "azerty"], "a": 2, "e": "Long, varié et imprévisible.", "em": "🔑"}, {"id": "te338", "t": "quiz", "s": "te", "h": "Quiz", "b": "", "tags": ["énergie"], "q": "Une batterie stocke l’énergie sous forme…", "o": ["chimique", "lumineuse", "sonore", "thermique"], "a": 0, "e": "Elle la restitue ensuite sous forme électrique.", "em": "🔋"}, {"id": "te339", "t": "quiz", "s": "te", "h": "Quiz", "b": "", "tags": ["réseaux"], "q": "Une adresse IP sert à…", "o": ["identifier un appareil sur un réseau", "chiffrer un mot de passe", "alimenter un circuit", "dessiner en 3D"], "a": 0, "e": "Chaque appareil connecté en a une.", "em": "📡"}, {"id": "te340", "t": "quiz", "s": "te", "h": "Quiz", "b": "", "tags": ["numérique"], "q": "En France, l’autorité qui protège les données personnelles :", "o": ["l’INSEE", "la CNIL", "l’ONU", "l’OTAN"], "a": 1, "e": "Commission nationale de l’informatique et des libertés.", "em": "🔐"}, {"id": "or341", "t": "methode", "s": "or", "h": "Choisir son sujet", "b": "Prends un projet que tu peux **raconter de l’intérieur** : ce que tu as fait, pas seulement ce que tu as appris.\n- Histoire des arts, EPI, voyage, stage d’observation, projet citoyen, projet artistique.\n- Pose-toi la question : est-ce que je peux en parler 5 minutes avec enthousiasme ?", "tags": ["sujet"], "em": "🎯"}, {"id": "or342", "t": "conseil", "s": "or", "h": "10 questions que le jury peut poser", "b": "- Pourquoi avoir choisi ce sujet ?\n- Quelle a été la plus grande difficulté ?\n- Que referais-tu autrement ?\n- Qu’as-tu appris sur toi ?\n- Quel lien avec ton orientation ?\n- Peux-tu expliquer ce mot que tu as utilisé ?\n- Quelle œuvre t’a le plus marqué ?\n- Comment as-tu travaillé en groupe ?\n- Où as-tu trouvé tes informations ?\n- Si tu devais résumer en une phrase ?", "tags": ["entretien"], "em": "💬"}, {"id": "or343", "t": "conseil", "s": "or", "h": "Le trac, ça se gère", "b": "Le trac est normal, le jury le sait. Avant d’entrer : respiration lente, expiration longue. Les 30 premières secondes sont les plus dures : **apprends ton introduction presque par cœur**, le reste suivra.", "tags": ["posture"], "em": "😮‍💨"}, {"id": "or344", "t": "fiche", "s": "or", "h": "Une partie en langue vivante ?", "b": "Tu peux présenter **une partie** de ton oral dans une langue vivante étudiée au collège. C’est un vrai plus si tu es à l’aise, à condition de le préparer et de prévenir l’établissement selon ses modalités.", "tags": ["format"], "em": "⏱️"}, {"id": "or345", "t": "methode", "s": "or", "h": "Répéter efficacement", "b": "1. Enregistre-toi sur ton téléphone et écoute : débit, « euh », volume.\n2. Répète **debout**, comme le jour J.\n3. Fais-le devant quelqu’un qui te pose des questions.\n4. Chronomètre : l’exposé doit tenir en 5 minutes, pas 2, pas 8.", "tags": ["préparation"], "em": "🔁"}, {"id": "or346", "t": "conseil", "s": "or", "h": "Les 30 secondes qui comptent", "b": "Entre, salue, attends qu’on t’invite à t’asseoir, présente-toi et annonce ton sujet clairement. À la fin : « Merci de votre écoute, je suis prêt pour vos questions. » Ça paraît simple, ça fait une vraie impression.", "tags": ["posture"], "em": "👋"}, {"id": "or347", "t": "quiz", "s": "or", "h": "Quiz", "b": "", "tags": ["format"], "q": "Un oral passé en groupe dure…", "o": ["15 min", "20 min", "25 min", "30 min"], "a": 2, "e": "25 minutes : 10 d’exposé, 15 d’entretien.", "em": "⏱️"}, {"id": "or348", "t": "quiz", "s": "or", "h": "Quiz", "b": "", "tags": ["format"], "q": "Sur 20, l’expression orale vaut…", "o": ["8 points", "10 points", "12 points", "4 points"], "a": 0, "e": "8 points pour l’expression, 12 pour la maîtrise du sujet.", "em": "⏱️"}, {"id": "or349", "t": "quiz", "s": "or", "h": "Quiz", "b": "", "tags": ["format"], "q": "Peut-on présenter une partie de l’oral en langue vivante ?", "o": ["non, jamais", "oui, une partie", "oui, obligatoirement tout", "seulement en latin"], "a": 1, "e": "Une partie peut être présentée dans une langue vivante étudiée.", "em": "⏱️"}, {"id": "or350", "t": "quiz", "s": "or", "h": "Quiz", "b": "", "tags": ["posture"], "q": "Tu perds le fil pendant l’exposé :", "o": ["tu t’arrêtes définitivement", "tu jettes un œil à ta fiche de mots-clés", "tu lis ton texte entier", "tu changes de sujet"], "a": 1, "e": "Les mots-clés servent exactement à ça.", "em": "🗒️"}, {"id": "or351", "t": "quiz", "s": "or", "h": "Quiz", "b": "", "tags": ["format"], "q": "L’entretien individuel dure…", "o": ["5 min", "10 min", "15 min", "20 min"], "a": 1, "e": "10 minutes après 5 minutes d’exposé.", "em": "⏱️"}, {"id": "me352", "t": "fiche", "s": "me", "h": "Les verbes de consigne décodés", "b": "- **Relever / citer** : recopier un passage exact, entre guillemets.\n- **Identifier** : nommer précisément.\n- **Décrire** : dire ce que l’on voit ou ce qui se passe, sans expliquer.\n- **Expliquer** : dire pourquoi ou comment.\n- **Justifier** : prouver sa réponse avec un élément précis.\n- **Comparer** : montrer ressemblances ET différences.\n- **Argumenter** : défendre un point de vue avec des arguments.", "tags": ["consignes"], "em": "🔍"}, {"id": "me353", "t": "methode", "s": "me", "h": "La carte mentale", "b": "1. Le thème au **centre**.\n2. Des branches principales pour les grandes idées, de couleurs différentes.\n3. Des sous-branches avec des **mots-clés**, pas des phrases.\n4. Des dessins ou symboles pour aider la mémoire.\n> Refais-la de mémoire, puis compare : c’est là qu’elle devient efficace.", "tags": ["mémoire", "organisation"], "em": "🕸️"}, {"id": "me354", "t": "methode", "s": "me", "h": "Le planning à rebours", "b": "Pars de la date du brevet et remonte :\n- **Juin** : sujets complets en conditions réelles, révisions légères.\n- **Mai** : oral, annales par matière.\n- **Avril** (vacances) : un chapitre par jour et par matière, avec quiz.\n- **Avant** : fiches au fil de l’année.\n> Bloque des créneaux fixes dans la semaine, comme un entraînement sportif.", "tags": ["organisation"], "em": "🗓️"}, {"id": "me355", "t": "methode", "s": "me", "h": "Des fiches qui servent vraiment", "b": "Format **question au recto, réponse au verso**. Une notion par fiche. Tu les fais tourner jusqu’à ce que tu les saches sans hésiter, puis tu les espaces.\n> Une fiche recopiée du cours n’est pas une fiche, c’est une copie.", "tags": ["mémoire"], "em": "🗒️"}, {"id": "me356", "t": "conseil", "s": "me", "h": "Les annales : le meilleur entraînement", "b": "Les sujets des années précédentes (annales) montrent exactement ce qu’on attend. Fais-en au moins un complet par matière **chronométré**, puis corrige-toi avec le corrigé et note tes erreurs types.", "tags": ["épreuve"], "em": "📚"}, {"id": "me357", "t": "conseil", "s": "me", "h": "Soigne ta copie", "b": "Écriture lisible, marge, saut de ligne entre les exercices, numéros des questions bien visibles. Un correcteur qui lit facilement est un correcteur bien disposé.", "tags": ["épreuve"], "em": "✍️"}, {"id": "me358", "t": "conseil", "s": "me", "h": "Le carburant du cerveau", "b": "Petit-déjeuner le matin de l’épreuve, eau à portée de main, une activité physique dans la semaine. Les épreuves 2027 commencent à 8 h : entraîne-toi à réviser le matin.", "tags": ["santé", "jour J"], "em": "🎒"}, {"id": "me359", "t": "methode", "s": "me", "h": "Utiliser le brouillon intelligemment", "b": "Le brouillon sert à **planifier** : idées, plan, calculs, liste de mots-clés. Ne rédige jamais toute ta réponse au brouillon : tu manquerais de temps pour la recopier.", "tags": ["épreuve"], "em": "📝"}, {"id": "me360", "t": "quiz", "s": "me", "h": "Quiz", "b": "", "tags": ["consignes"], "q": "« Justifier » signifie…", "o": ["recopier le texte", "prouver sa réponse avec un élément précis", "donner son avis", "faire un dessin"], "a": 1, "e": "Une réponse justifiée s’appuie sur une preuve.", "em": "🔍"}, {"id": "me361", "t": "quiz", "s": "me", "h": "Quiz", "b": "", "tags": ["notation"], "q": "Seuil de la mention Bien :", "o": ["12/20", "14/20", "15/20", "16/20"], "a": 1, "e": "AB 12, B 14, TB 16, félicitations 18.", "em": "🏅"}, {"id": "me362", "t": "quiz", "s": "me", "h": "Quiz", "b": "", "tags": ["notation"], "q": "Note minimale pour obtenir le brevet :", "o": ["8/20", "10/20", "12/20", "400 points"], "a": 1, "e": "10/20 de moyenne finale.", "em": "🏅"}, {"id": "me363", "t": "quiz", "s": "me", "h": "Quiz", "b": "", "tags": ["notation"], "q": "Le contrôle continu compte pour…", "o": ["20 %", "40 %", "50 %", "60 %"], "a": 1, "e": "40 % ; les épreuves finales comptent pour 60 %.", "em": "🏅"}, {"id": "me364", "t": "quiz", "s": "me", "h": "Quiz", "b": "", "tags": ["consignes"], "q": "« Comparer » demande de montrer…", "o": ["seulement les différences", "seulement les ressemblances", "ressemblances et différences", "son opinion"], "a": 2, "e": "Comparer = les deux.", "em": "🔍"}, {"id": "me365", "t": "quiz", "s": "me", "h": "Quiz", "b": "", "tags": ["mémoire"], "q": "Pendant le sommeil, le cerveau…", "o": ["efface tout", "consolide ce qui a été appris", "ne fait rien", "apprend de nouvelles notions"], "a": 1, "e": "Le sommeil fixe les apprentissages.", "em": "😴"}], "exams": [{"id": "fr", "s": "fr", "n": "Français", "when": "Jeudi 24 juin 2027, dès 8 h", "dur": "3 h", "coef": "2", "parts": [{"n": "Compréhension, interprétation, grammaire et compétences li function mountQuiz(root, it, done){

}

  h = document.createElement("div"); h.className = "burst"; h.innerHTML = ICON.heart;

}

/* ---------------- fil ---------------- */
var feedFilter = "all", io = null;
function feedOrder(){
  var pool = [], k, it, unseen = [], seen = [];
  for (k = 0; k < D.items.length; k++) { it = D.items[k]; if (feedFilter === "all" || it.s === feedFilter) pool.push(it); }
  for (k = 0; k < pool.length; k++) (st.seen[pool[k].id] ? seen : unseen).push(pool[k]);
  unseen = shuffle(unseen); seen = shuffle(seen);
  if (feedFilter === "all") {
    /* évite deux cartes de la même matière d'affilée */
    var src = unseen.concat(seen), outA = [], guard;
    while (src.length) {
      guard = 0;
      while (guard < src.length && outA.length && src[guard].s === outA[outA.length - 1].s) guard++;
      if (guard >= src.length) guard = 0;
      outA.push(src.splice(guard, 1)[0]);
    }
    return outA;
  }
  return unseen.concat(seen);
}
function renderFeedChips(){
  var h = '<button class="chip' + (feedFilter === "all" ? " on" : "") + '" data-f="all">✨ Pour toi</button>', k;
  for (k = 0; k < D.subjects.length; k++) h += '<button class="chip' + (feedFilter === D.subjects[k].k ? " on" : "") + '" data-f="' + D.subjects[k].k + '">' + D.subjects[k].e + ' ' + esc(D.subjects[k].n) + '</button>';
  $("feedChips").innerHTML = h;
}
function renderFeed(){
  var f = $("feed"), list = feedOrder(), k, frag = document.createDocumentFragment();
  if (io) io.disconnect();
  f.innerHTML = "";
  for (k = 0; k < list.length; k++) frag.appendChild(buildCard(list[k]));
  var end = document.createElement("article");
  end.className = "card endcard";
  end.innerHTML = '<div class="bgc irid" style="' + cardBg({c:"#25F4EE"}) + '"></div><div class="inner"><div class="hero" aria-hidden="true"><div class="stk"><span class="e emo">🏁</span><span class="s1 emo">🔥</span><span class="s2 emo">🎉</span></div></div><div class="cnt"><h2 class="hook wide glitch">Tu as tout vu.</h2><div class="body"><p>Le fil recommence avec les cartes que tu n’as pas encore comprises. Ou passe au Défi chrono pour vérifier que ça tient.</p></div><button class="btn" data-go="defi">Lancer un défi</button> <button class="btn alt" data-go="refeed" style="margin-top:8px">Rejouer le fil</button></div></div>';
  end.addEventListener("click", function(ev){ var g = ev.target.getAttribute("data-go"); if (g === "defi") show("defi"); else if (g === "refeed") { renderFeed(); } });
  frag.appendChild(end);
  f.appendChild(frag);
  f.scrollTop = 0;
  if ("IntersectionObserver" in window) {
    io = new IntersectionObserver(function(entries){
      var z, id;
      for (z = 0; z < entries.length; z++) if (entries[z].isIntersecting) {
        id = entries[z].target.getAttribute("data-id");
        if (id && !st.seen[id]) { st.seen[id] = 1; touchDay(); save(); }
      }
    }, {root:f, threshold:0.65});
    var cards = f.querySelectorAll(".card[data-id]");
    for (k = 0; k < cards.length; k++) io.observe(cards[k]);
  }
}

function startReview(){
  var ids = shuffle(dueList()), idx = 0, okN = 0;
  if (!ids.length) { toast("Rien à revoir aujourd’hui"); return; }
  function finish(){
    var b = openOv("À revoir", '<div class="chr"><div class="tm wide glitch">' + okN + '/' + ids.length + '</div><p class="ph">cartes réussies. Les autres reviendront demain.</p><button class="btn full" id="rvEnd">Terminer</button></div>', true, refreshCurrent);
    $("rvEnd").onclick = closeOv;
  }
  function grade(it, good){
    var b = st.box[it.id] || {b:1};
    if (good) { b.b = Math.min(7, b.b + 1); b.d = addDays(BOX_DAYS[Math.min(6, b.b)]); okN++; addXP(5, true); }
    else { b.b = 1; b.d = addDays(1); }
    if (b.b > 6) { delete st.box[it.id]; if (it.t !== "quiz") st.liked[it.id] = 1; } else st.box[it.id] = b;
    save(); updateBadge();
  }
  function next(){
    if (idx >= ids.length) { finish(); return; }
    var it = BYID[ids[idx]], s = SUBJ[it.s], head = "À revoir : " + (idx + 1) + " / " + ids.length;
    var html = '<article class="solo irid" style="' + cardBg(s) + '"><div class="inner">';

      openOv(head, html, true, refreshCurrent);
      var art = $("ovb").querySelector(".solo");
      mountQuiz(art, it, function(good){ grade(it, good); $("rvBar").style.display = "flex"; $("rvN").onclick = function(){ idx++; next(); }; });
    } else {
      html += heroHTML(it) + '<span class="pill ' + it.t + '">' + TYPE_EM[it.t] + ' ' + TYPES[it.t] + '</span><h2 class="hook wide glitch">' + inl(it.h) + '</h2><p class="body" id="rvAsk">Avant de retourner la carte, dis à voix haute ou écris ce que tu sais sur cette notion.</p><div class="body" id="rvB" style="display:none">' + md(it.b) + '</div></div>' +
        '<div class="solobar"><button class="btn cy" id="rvShow">Retourner la carte</button></div><div class="solobar" id="rvG" style="display:none"><button class="btn" id="rvKo">À revoir</button><button class="btn cy" id="rvOk">Je savais</button></div></article>';
      openOv(head, html, true, refreshCurrent);
      $("rvShow").onclick = function(){ $("rvB").style.display = "block"; $("rvAsk").style.display = "none"; this.parentNode.style.display = "none"; $("rvG").style.display = "flex"; };
      $("rvOk").onclick = function(){ grade(it, true); idx++; next(); };
      $("rvKo").onclick = function(){ grade(it, false); idx++; next(); };
    }
  }
  touchDay();
  next();
}

var chrono = null;
function fmt(ms){ var s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ":" + pad(m) : m) + ":" + pad(x); }
function beep(){

function openChrono(e){

  function list(){
    var h = "", k; for (k = 0; k < ph.length; k++) h += '<li class="' + (k < chrono.i ? "done" : k === chrono.i ? "cur" : "") + '"><span>' + esc(ph[k].n) + '</span><span>' + esc(ph[k].d) + '</span></li>';
    $("cL").innerHTML = h;
    $("cPh").textContent = chrono.i < ph.length ? "Partie " + (chrono.i + 1) + " sur " + ph.length + " : " + ph[chrono.i].n : "Épreuve terminée. Pose le stylo.";

  }
  function nextPh(){

    if (chrono.i >= ph.length) { clearInterval(chrono.t); $("cTm").textContent = "0:00"; $("cP").style.display = "none"; $("cN").style.display = "none"; list(); addXP(20); return; }
    chrono.end = Date.now() + ph[chrono.i].m * 60000; chrono.paused = false; $("cP").textContent = "Pause"; list();
  }
  function tick(){ if (!chrono || chrono.paused) return; var left = chrono.end - Date.now(); $("cTm").textContent = fmt(left); if (left <= 0) nextPh(); }

  };
}

var simV = {cc:"", fr:"", ma:"", hg:"", emc:"", sc:"", or:""};

    '<div class="stats"><div class="stat"><b>⚡ ' + st.xp + '</b><span>XP</span></div><div class="stat"><b>🔥 ' + (st.last === dayKey() || st.last === addDays(-1) ? st.streak : 0) + '</b><span>jours de série</span></div><div class="stat"><b>✅ ' + totM + '</b><span>cartes acquises</span></div></div></div>';

  }
  h += '</div>';
  h += '<div class="block"><h3>🧮 Simulateur de note</h3><p class="small" style="margin-top:0">Entre ta moyenne générale de 3e et des notes d’entraînement sur 20. Laisse vide ce que tu ne connais pas encore.</p><div class="simg">' +
    simRow("cc", "📚 Moyenne générale (contrôle continu)", "40 %") + simRow("fr", "📖 Français", "coef 2") + simRow("ma", "📐 Maths", "coef 2") + simRow("hg", "🗺️ Histoire-géo", "coef 1,5") + simRow("emc", "🗳️ EMC", "coef 0,5") + simRow("sc", "🔬 Sciences", "coef 2") + simRow("or", "🎤 Oral", "coef 2") +

    '<div class="setrow"><span>Ambiance du fil et des défis</span></div><div class="seg" id="vbSeg"><button data-b="pop">Jour, clair</button><button data-b="night">Nuit, néon</button></div>' +
    '<div class="setrow"><span>Thème des pages</span></div><div class="seg" id="thSeg"><button data-t="auto">Auto</button><button data-t="light">Clair</button><button data-t="dark">Sombre</button></div>' +
    '<div class="setrow"><span>Police de lecture</span></div><div class="seg" id="ftSeg"><button data-d="0">Standard</button><button data-d="1">Lexend (DYS)</button></div>' +
    '<div class="setrow"><span>Taille du texte</span></div><div class="seg" id="fsSeg"><button data-s="0.9">A−</button><button data-s="1">A</button><button data-s="1.12">A+</button><button data-s="1.25">A++</button></div>' +
    '<div class="setrow" style="margin-top:20px"><span>Ma progression</span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn alt" id="exp">Exporter</button><button class="btn alt" id="imp">Importer</button><input type="file" id="impF" accept=".json,application/json" class="sr"><button class="btn alt" id="rst" style="color:var(--pink-ink)">Tout effacer</button></div>' +
    '<p class="small" style="margin-top:16px">Tes données restent sur cet appareil : pas de compte, rien n’est envoyé. Exporte ta progression pour la retrouver sur un autre appareil.</p></div>';
  h += '<p class="wide glitch-sm" style="text-align:center;margin:30px 0 2px;font-size:1.3em">Swipe ton brevet</p><p class="small" style="text-align:center;margin:0 0 6px">Une appli BROT2YOU. Gratuite, sans pub, sans compte.</p></div>';
  $("v-me").innerHTML = h;

  $("pseudo").onchange = function(){ st.pseudo = this.value.replace(/^\s+|\s+$/g, ""); save(); renderMe(); };

  bs = $("fsSeg").children; for (z = 0; z < bs.length; z++) bs[z].className = +bs[z].getAttribute("data-s") === +st.fs ? "on" : "";

function simRow(k, label, cf){ return '<label for="sim_' + k + '">' + label + '</label><input id="sim_' + k + '" data-k="' + k + '" type="number" inputmode="decimal" min="0" max="20" step="0.1" placeholder="/20" value="' + esc(simV[k]) + '"><span class="cf">' + cf + '</span>'; }
function num(v){ if (v === "" || v === null || v === undefined) return null; var n = parseFloat(String(v).replace(",", ".")); if (isNaN(n)) return null; return Math.max(0, Math.min(20, n)); }

function sim(){

  }

function exportData(){

function importData(){

var current = "feed";
